name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      ONELAKE_CI_DUCKDB: ${{ github.workspace }}/data/warehouse/ci.duckdb
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install Python deps
        run: python -m pip install -r requirements.txt

      - name: Cache dbt packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.dbt
            transform/dbt_packages
          key: dbt-${{ runner.os }}-${{ hashFiles('transform/package-lock.yml') }}

      - name: dbt deps
        working-directory: transform
        run: dbt deps --profiles-dir .

      - name: Create CI warehouse dir
        run: mkdir -p data/warehouse

      - name: dbt build (CI fixture)
        working-directory: transform
        run: |
          dbt build --target ci --profiles-dir . --vars '{ci_mode: true}' --exclude tag:volume tag:freshness

      - name: dbt docs generate
        working-directory: transform
        run: |
          dbt docs generate --target ci --profiles-dir . --vars '{ci_mode: true}'
